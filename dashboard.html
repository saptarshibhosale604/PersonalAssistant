<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Spec Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; zoom: 150%; }
        .dashboard { width: 100%; max-width: 900px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); padding: 30px; border: 1px solid #334155; }
        h1 { text-align: center; margin-bottom: 25px; color: #38bdf8; font-size: 28px; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #0f172a; border-radius: 12px; padding: 20px; border-left: 5px solid #38bdf8; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card.cpu { border-left-color: #38bdf8; }
        .card.ram { border-left-color: #a855f7; }
        .card.storage { border-left-color: #ec4899; }
        .card.os { border-left-color: #10b981; }
        .title { font-size: 14px; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
        .value { font-size: 18px; font-weight: bold; color: #f1f5f9; }
        .sub { font-size: 13px; color: #64748b; margin-top: 4px; }
        .footer { text-align: center; margin-top: 30px; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>💻 Laptop Specifications Dashboard</h1>
        <div class="grid">
            <div class="card cpu">
                <div class="title">Processor (CPU)</div>
                <div class="value">Intel Core i5-9300HF</div>
                <div class="sub">2.40GHz | 4 Cores, 8 Threads</div>
            </div>
            <div class="card ram">
                <div class="title">Memory (RAM)</div>
                <div class="value">8.00 GB</div>
                <div class="sub">Physical System Memory</div>
            </div>
            <div class="card storage">
                <div class="title">Storage Drives</div>
                <div class="value">232.89 GB SSD</div>
                <div class="sub">WDC WDS250G2B0C + 931.51 GB HDD</div>
            </div>
            <div class="card os">
                <div class="title">Operating System</div>
                <div class="value">Windows 11</div>
                <div class="sub">Build 10.0.26200 (SSBWindows)</div>
            </div>
        </div>
        <div class="footer">Generated live for user: LENOVO</div>
    </div>
</body>
</html>
